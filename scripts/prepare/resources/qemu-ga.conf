# QemuWeb: the guest agent answers read-only network queries only. Everything not listed here is blocked
# (guest-exec, guest-file-*, guest-set-user-password, guest-shutdown, ...). The host sends nothing else
# either (runner/guest-agent.js); this file is a second wall inside the image. Study: docs/guest-agent.md.
[general]
allow-rpcs=guest-sync,guest-sync-delimited,guest-ping,guest-info,guest-network-get-interfaces
