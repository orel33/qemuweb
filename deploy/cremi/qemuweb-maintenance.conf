# Maintenance site: stage 1 of install-cremi.md (static page, no OpenID), and the site to put in place of
# qemuweb.conf when QemuWeb must be taken offline (see "Maintenance mode" in install-cremi.md).
# Installed as /etc/apache2/sites-available/qemuweb-maintenance.conf, enabled INSTEAD of qemuweb.conf (both
# define the same names: never enable the two together). Public name: qemuweb.emi.u-bordeaux.fr, an alias of the
# CREMI https relay, which forwards to v0-qemuweb. Modules: ssl and rewrite.

<VirtualHost *:80>
    ServerName v0-qemuweb.emi.u-bordeaux.fr
    ServerAlias v0-qemuweb qemuweb.emi.u-bordeaux.fr
    Redirect 302 / "https://v0-qemuweb.emi.u-bordeaux.fr/"
</VirtualHost>

<VirtualHost *:443>
    ServerName v0-qemuweb.emi.u-bordeaux.fr
    ServerAlias v0-qemuweb qemuweb.emi.u-bordeaux.fr

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/star_emi_u-bordeaux_fr.crt
    SSLCertificateKeyFile /etc/apache2/certs/star_emi_u-bordeaux_fr.key

    DocumentRoot /var/www/qemuweb
    <Directory /var/www/qemuweb>
        Require all granted
        # maintenance.html shows the OpenID identity of the user (server side includes, module include)
        Options +Includes
        <Files "maintenance.html">
            SetOutputFilter INCLUDES
        </Files>
    </Directory>

    # Every path answers 503 (service unavailable) with the maintenance page; the page itself is served as is
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/maintenance\.html$
    RewriteRule ^ - [R=503,L]
    ErrorDocument 503 /maintenance.html

    ErrorLog ${APACHE_LOG_DIR}/qemuweb-error.log
    CustomLog ${APACHE_LOG_DIR}/qemuweb-access.log combined
</VirtualHost>
