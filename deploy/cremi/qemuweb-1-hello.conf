# Stage 1: static page over HTTP and HTTPS, no OpenID.
# Installed as /etc/apache2/sites-available/qemuweb.conf (see install-cremi.md). Public name:
# qemuweb.emi.u-bordeaux.fr, an alias of the CREMI https relay, which forwards to v0-qemuweb.

<VirtualHost *:80>
    ServerName v0-qemuweb.emi.u-bordeaux.fr
    ServerAlias v0-qemuweb qemuweb.emi.u-bordeaux.fr
    Redirect 302 / https://qemuweb.emi.u-bordeaux.fr/
</VirtualHost>

<VirtualHost *:443>
    ServerName v0-qemuweb.emi.u-bordeaux.fr
    ServerAlias v0-qemuweb qemuweb.emi.u-bordeaux.fr

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/star_emi_u-bordeaux_fr.crt
    SSLCertificateKeyFile /etc/apache2/certs/star_emi_u-bordeaux_fr.key

    DocumentRoot /var/www/qemuweb
    DirectoryIndex hello.html
    <Directory /var/www/qemuweb>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/qemuweb-error.log
    CustomLog ${APACHE_LOG_DIR}/qemuweb-access.log combined
</VirtualHost>
