# Stage 3: QemuWeb (127.0.0.1:3002) behind Apache and OpenID.
# Installed as /etc/apache2/sites-available/qemuweb.conf (see install-cremi.md).
# The client secrets are NOT here: they are in /etc/apache2/qemuweb-oidc.inc (root, mode 0600).

<VirtualHost *:80>
    ServerName v0-qemuweb.emi.u-bordeaux.fr
    ServerAlias v0-qemuweb qemuweb.emi.u-bordeaux.fr
    Redirect 302 / https://qemuweb.emi.u-bordeaux.fr/
</VirtualHost>

<VirtualHost *:443>
    ServerName v0-qemuweb.emi.u-bordeaux.fr
    ServerAlias v0-qemuweb qemuweb.emi.u-bordeaux.fr

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/star_emi_u-bordeaux_fr.crt
    SSLCertificateKeyFile /etc/apache2/certs/star_emi_u-bordeaux_fr.key

    # Static files kept by Apache: the waiting page and the logout page
    DocumentRoot /var/www/qemuweb
    <Directory /var/www/qemuweb>
        Require all granted
    </Directory>

    # OpenID: OIDCClientID, OIDCClientSecret, OIDCCryptoPassphrase
    Include /etc/apache2/qemuweb-oidc.inc
    OIDCProviderMetadataURL "https://openid.emi.u-bordeaux.fr/.well-known/openid-configuration"
    OIDCProviderTokenEndpointAuth client_secret_post
    OIDCRemoteUserClaim preferred_username
    OIDCScope "openid profile email grps"
    OIDCRedirectURI /.openid
    OIDCSessionInactivityTimeout 10800
    OIDCXForwardedHeaders X-Forwarded-Host

    # Everything is protected: a CREMI account with the group cremi-active
    <Location />
        AuthType openid-connect
        AuthName "QemuWeb"
        Require claim grps:cremi-active
    </Location>

    # Not protected by OpenID. A <Location> after the one above replaces its rules.
    # After a logout: no immediate new login
    <Location /au-revoir>
        AuthType None
        Require all granted
    </Location>
    # The waiting page must show even when nobody is logged in (error page of a stopped server)
    <Location /attente.html>
        AuthType None
        Require all granted
    </Location>
    # A runner has no browser: it authenticates itself with its token, checked by QemuWeb
    <Location /runner/connect>
        AuthType None
        Require all granted
    </Location>
    <Location /api/runner/register>
        AuthType None
        Require all granted
        LimitRequestBody 8192
    </Location>

    # Identity of the user for the application: nothing sent by a browser survives
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-User-Mail early
    RequestHeader unset X-User-Groups early
    RequestHeader unset X-User-DisplayName early
    RequestHeader set X-Remote-User "%{OIDC_CLAIM_preferred_username}e" env=OIDC_CLAIM_preferred_username
    RequestHeader set X-User-Mail "%{OIDC_CLAIM_email}e" env=OIDC_CLAIM_email
    RequestHeader set X-User-Groups "%{OIDC_CLAIM_grps}e" env=OIDC_CLAIM_grps
    RequestHeader set X-User-DisplayName "%{OIDC_CLAIM_name}e" env=OIDC_CLAIM_name

    # The browser spoke https to Apache: the login cookie of QemuWeb is then Secure
    # (the server runs with --trust-proxy loopback)
    RequestHeader set X-Forwarded-Proto "https"

    # Session ZIP archives (flat sparse files): 1 GiB
    LimitRequestBody 1073741824

    # Reverse proxy. What Apache keeps comes first; the first matching ProxyPass wins.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 3600
    ProxyPass /.openid !
    ProxyPass /attente.html !
    ProxyPass /au-revoir !
    # upgrade=websocket: Socket.IO and /runner/connect (Apache 2.4.47 or later)
    ProxyPass / http://127.0.0.1:3002/ upgrade=websocket timeout=3600
    ProxyPassReverse / http://127.0.0.1:3002/

    # Waiting page while QemuWeb is stopped or restarting
    Alias /attente.html /var/www/qemuweb/attente.html
    Alias /au-revoir /var/www/qemuweb/au-revoir.html
    ErrorDocument 502 /attente.html
    ErrorDocument 503 /attente.html

    LogFormat "%h \"%{X-Forwarded-For}i\" user=%{X-Remote-User}i %t \"%r\" %>s %b" qemuweb
    ErrorLog ${APACHE_LOG_DIR}/qemuweb-error.log
    CustomLog ${APACHE_LOG_DIR}/qemuweb-access.log qemuweb
</VirtualHost>
