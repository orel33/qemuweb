# Temporary test site: a static page on ports 80 and 443, no QemuWeb, no redirect.
server {
    listen 80;
    listen 443 ssl;
    server_name v0-qemuweb v0-qemuweb.emi.u-bordeaux.fr qemuweb.emi.u-bordeaux.fr;   # the CREMI frontend may send either name
    ssl_certificate     /srv/cert/server.crt;
    ssl_certificate_key /srv/cert/key.pem;
    root /var/www/qemuweb-test;
}
