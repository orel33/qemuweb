<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d73"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
  </defs>
  <!-- machines -->
  <rect x="8" y="8" width="470" height="314" rx="10" fill="#f3f7fc" stroke="#0f3d73" stroke-width="1.6"/>
  <text x="22" y="28" font-size="13" font-weight="bold" fill="#0f3d73">SERVER machine</text>
  <rect x="600" y="8" width="192" height="314" rx="10" fill="#f1f9f4" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="614" y="28" font-size="13" font-weight="bold" fill="#1f7a4d">REMOTE machine</text>
  <text x="614" y="44" font-size="9.5" fill="#1f7a4d">no inbound port</text>

  <!-- browsers -->
  <rect x="22" y="56" width="140" height="58" rx="6" fill="#fff6e5" stroke="#8a5a00" stroke-width="1.4"/>
  <text x="92" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5a00">Browsers</text>
  <text x="92" y="98" text-anchor="middle" font-size="9.5" fill="#5a4000">admin · student (toto)</text>

  <!-- nginx -->
  <rect x="222" y="56" width="130" height="58" rx="6" fill="#ffffff" stroke="#0f3d73" stroke-width="1.4"/>
  <text x="287" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f3d73">nginx (variant B)</text>
  <text x="287" y="98" text-anchor="middle" font-size="9.5" fill="#33415a">TLS on :443</text>

  <!-- server -->
  <rect x="216" y="190" width="252" height="116" rx="6" fill="#ffffff" stroke="#0f3d73" stroke-width="2"/>
  <text x="342" y="213" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f3d73">QemuWeb server</text>
  <text x="342" y="231" text-anchor="middle" font-size="9.5" fill="#33415a">server.sh --listen 3002 (127.0.0.1)</text>
  <text x="342" y="251" text-anchor="middle" font-size="9.5" fill="#33415a">accounts · sessions · placement</text>
  <text x="342" y="267" text-anchor="middle" font-size="9.5" fill="#33415a">/admin/runners · runners.json</text>
  <text x="342" y="283" text-anchor="middle" font-size="9.5" fill="#33415a">gateway: /runner/connect</text>
  <text x="342" y="298" text-anchor="middle" font-size="9.5" fill="#33415a">+ /api/runner/register</text>

  <!-- runner and VMs -->
  <rect x="612" y="190" width="168" height="62" rx="6" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/>
  <text x="696" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f7a4d">Remote runner</text>
  <text x="696" y="230" text-anchor="middle" font-size="9.5" fill="#33415a">runner.sh run</text>
  <text x="696" y="243" text-anchor="middle" font-size="9.5" fill="#33415a">runner.json (token, 0600)</text>
  <rect x="612" y="268" width="168" height="42" rx="6" fill="#e6f3ec" stroke="#1f7a4d" stroke-width="1.2"/>
  <text x="696" y="286" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f7a4d">QEMU hosts + VDE switches</text>
  <text x="696" y="300" text-anchor="middle" font-size="9" fill="#33415a">keep running if the link drops</text>
  <line x1="696" y1="252" x2="696" y2="267" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- browsers -> nginx (HTTPS) -->
  <line x1="162" y1="85" x2="220" y2="85" stroke="#8a5a00" stroke-width="2" marker-end="url(#ao)"/>
  <text x="191" y="76" text-anchor="middle" font-size="9" fill="#8a5a00">HTTPS</text>
  <!-- nginx -> server -->
  <line x1="287" y1="114" x2="287" y2="188" stroke="#0f3d73" stroke-width="2" marker-end="url(#ah)"/>
  <text x="296" y="148" font-size="9" fill="#0f3d73">proxy_pass 127.0.0.1:3002</text>
  <!-- variant A: browser on the server machine -->
  <path d="M60,114 L60,248 L214,248" fill="none" stroke="#8a5a00" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <text x="68" y="168" font-size="9" fill="#8a5a00">variant A: browser on</text>
  <text x="68" y="180" font-size="9" fill="#8a5a00">SERVER, http://127.0.0.1:3002</text>

  <!-- the two arrows that cross the network, both start on REMOTE -->
  <line x1="612" y1="208" x2="470" y2="208" stroke="#1f7a4d" stroke-width="2.8" marker-end="url(#ag)"/>
  <text x="541" y="197" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f7a4d">① WebSocket</text>
  <text x="541" y="224" text-anchor="middle" font-size="9" fill="#1f7a4d">dials out, stays open</text>
  <line x1="612" y1="250" x2="470" y2="250" stroke="#1f7a4d" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text x="541" y="241" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f7a4d">② register</text>
  <text x="541" y="266" text-anchor="middle" font-size="9" fill="#1f7a4d">once, with a token</text>
  <text x="541" y="296" text-anchor="middle" font-size="9" fill="#8a5a00">variant A: through</text>
  <text x="541" y="308" text-anchor="middle" font-size="9" fill="#8a5a00">an SSH tunnel</text>
</svg>
