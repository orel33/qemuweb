<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14284a"/></marker>
  </defs>

  <!-- Browser -->
  <rect x="250" y="8" width="320" height="54" rx="6" fill="#ffffff" stroke="#14284a" stroke-width="1.6"/>
  <text x="410" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#14284a">Browser · public/</text>
  <text x="410" y="48" text-anchor="middle" font-size="10" fill="#33415a">web interface (ES modules) · xterm.js terminals</text>
  <line x1="410" y1="62" x2="410" y2="100" stroke="#14284a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="420" y="84" font-size="9.5" fill="#14284a">HTTP / JSON and Socket.IO, signed cookie</text>

  <!-- Server -->
  <rect x="14" y="100" width="792" height="152" rx="8" fill="#f4f6f9" stroke="#14284a" stroke-width="1.8"/>
  <text x="28" y="118" font-size="11.5" font-weight="bold" fill="#14284a">Node.js server · server/main.js</text>
  <rect x="28" y="130" width="170" height="46" rx="5" fill="#ffffff" stroke="#14284a" stroke-width="1.2"/>
  <text x="113" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14284a">Authentication</text>
  <text x="113" y="165" text-anchor="middle" font-size="9" fill="#33415a">server/auth/</text>
  <rect x="226" y="130" width="190" height="46" rx="5" fill="#ffffff" stroke="#14284a" stroke-width="1.2"/>
  <text x="321" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14284a">Session manager</text>
  <text x="321" y="165" text-anchor="middle" font-size="9" fill="#33415a">one session per user</text>
  <rect x="444" y="130" width="200" height="46" rx="5" fill="#ffffff" stroke="#14284a" stroke-width="1.2"/>
  <text x="544" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14284a">HTTP API + Socket.IO</text>
  <text x="544" y="165" text-anchor="middle" font-size="9" fill="#33415a">server/routes/, server/sockets.js</text>
  <rect x="672" y="130" width="120" height="46" rx="5" fill="#ffffff" stroke="#14284a" stroke-width="1.2"/>
  <text x="732" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14284a">Admin</text>
  <text x="732" y="165" text-anchor="middle" font-size="9" fill="#33415a">/admin, audit logs</text>
  <line x1="198" y1="153" x2="224" y2="153" stroke="#14284a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="416" y1="153" x2="442" y2="153" stroke="#14284a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="226" y="196" width="418" height="44" rx="5" fill="#ffffff" stroke="#14284a" stroke-width="1.2"/>
  <text x="435" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14284a">Runner registry and gateways</text>
  <text x="435" y="230" text-anchor="middle" font-size="9" fill="#33415a">placement of each new session · Unix socket and WebSocket</text>
  <line x1="321" y1="176" x2="321" y2="194" stroke="#14284a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="544" y1="176" x2="544" y2="194" stroke="#14284a" stroke-width="1.5" marker-start="url(#a)"/>

  <!-- Runners -->
  <line x1="300" y1="252" x2="225" y2="304" stroke="#14284a" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="206" y="284" text-anchor="end" font-size="9.5" fill="#14284a">runner protocol</text>
  <text x="206" y="296" text-anchor="end" font-size="9" fill="#33415a">Unix socket</text>
  <line x1="570" y1="252" x2="635" y2="304" stroke="#14284a" stroke-width="2.2" stroke-dasharray="6 3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="640" y="284" font-size="9.5" fill="#14284a">runner protocol</text>
  <text x="640" y="296" font-size="9" fill="#33415a">WebSocket, opened by the runner</text>

  <rect x="40" y="304" width="360" height="54" rx="6" fill="#ffffff" stroke="#14284a" stroke-width="1.8"/>
  <text x="220" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14284a">Local runner · runner/main.js</text>
  <text x="220" y="344" text-anchor="middle" font-size="9.5" fill="#33415a">this machine, its own process group</text>
  <rect x="440" y="304" width="360" height="54" rx="6" fill="#ffffff" stroke="#14284a" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="620" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14284a">Remote runner · runner/main.js</text>
  <text x="620" y="344" text-anchor="middle" font-size="9.5" fill="#33415a">another machine, registered with a token</text>

  <!-- Processes -->
  <line x1="220" y1="358" x2="220" y2="386" stroke="#14284a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="386" width="360" height="46" rx="5" fill="#f4f6f9" stroke="#14284a" stroke-width="1.2"/>
  <text x="220" y="406" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14284a">QEMU · VirtualBox · vde_switch · vdeterm</text>
  <text x="220" y="421" text-anchor="middle" font-size="9" fill="#33415a">the machines of the sessions and their virtual network</text>
  <line x1="620" y1="358" x2="620" y2="386" stroke="#14284a" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#a)"/>
  <rect x="440" y="386" width="360" height="46" rx="5" fill="#f4f6f9" stroke="#14284a" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="620" y="406" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14284a">the same processes, on that machine</text>
  <text x="620" y="421" text-anchor="middle" font-size="9" fill="#33415a">the server never starts a virtual machine itself</text>

  <text x="410" y="458" text-anchor="middle" font-size="9" fill="#33415a">QEMU and VirtualBox plug into vde_switch (Ethernet frames); the runner drives them through serial and HMP sockets, and vdeterm through a pseudo-terminal.</text>
</svg>
